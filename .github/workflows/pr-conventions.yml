name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop, main]

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            hotfix
            docs
            refactor
            test
            chore
            ci
            revert
            release
          scopes: |
            web
            api
            db
            docs
            ci
          requireScope: false
          wip: true

  production-title:
    name: Production PR title
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require release or hotfix on main
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(release|hotfix|fix)(\(.+\))?: .+'; then
            exit 0
          fi
          echo "PRs into main must start with release:, hotfix:, or fix:"
          echo "Got: $TITLE"
          exit 1
