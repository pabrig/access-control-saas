services:
  postgres:
    image: postgres:15-alpine
    container_name: access-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: access_control_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d access_control_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
